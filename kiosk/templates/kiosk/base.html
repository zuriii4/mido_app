{% load static %}
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MIDo Kiosk{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"
            integrity="sha384-0bS8MmNIXqB6KQoBDNiUx5Oeb6or6hXgR2ai9qBcG7M3vR3bGqNmZk2uWvJQ7fZ"
            crossorigin="anonymous"></script>
    <!-- Extra styles -->
    <link rel="stylesheet" href="{% static 'kiosk/kiosk.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column" style="min-height: 100vh;">

    <!-- Hlavny obsah -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Kiosk JavaScript -->
    <script src="{% static 'kiosk/kiosk.js' %}" defer></script>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- Extra JS -->
    {% block extra_js %}{% endblock %}
</body>
</html>
