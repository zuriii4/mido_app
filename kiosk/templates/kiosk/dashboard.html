{% extends 'kiosk/base.html' %}

{% block title %}MIDo - Dashboard{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Ahoj, {{ user.get_full_name|default:user.username }}!</h1>
            <p class="text-muted mb-0">Zoznam dokumentov na podpísanie</p>
        </div>
        <a href="{% url 'kiosk:logout' %}" class="btn btn-outline-secondary">
            Odhlásiť sa
        </a>
    </div>

    <div class="mt-4">
        <p class="text-muted">Sem príde zoznam dokumentov (Etapa 3)</p>
    </div>

</div>
{% endblock %}
